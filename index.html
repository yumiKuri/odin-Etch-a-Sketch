<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Etch-a-Sketch</h1>
        <h3>By yumiKuri</h3>
        <div id="screen"></div>
        <div class="buttons">
            <button>Black</button>
            <button>White</button>
            <button>Rainbow</button>
            <button>Erase</button>
            <button>Reset</button>
        </div>
        <input type="number" id="gridNum" min="1" placeholder="Enter only full number">
        <button id="resizeBtn" type="button">Resize</button>
    </div>

</body>
</html>
